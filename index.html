<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>MeloDraft</title>

<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MeloDraft">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b0c10">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<script>
  // Apply saved theme before first paint to avoid a flash
  try {
    var s = JSON.parse(localStorage.getItem('melodraft_v2_settings') || 'null');
    var th = (s && s.theme) || localStorage.getItem('melodraft_theme') || 'dark';
    if (th === 'system') th = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
    document.documentElement.dataset.theme = th;
    var lg = (s && s.lang) || localStorage.getItem('melodraft_lang') || 'he';
    document.documentElement.lang = lg;
    document.documentElement.dir = lg === 'he' ? 'rtl' : 'ltr';
  } catch (e) {}
</script>
</head>
<body>
<div id="app"></div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
